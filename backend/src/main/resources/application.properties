spring.application.name=swiftdrop-backend

# Local settings come from the repository-root .env file (see .env.example) when the backend runs
# from backend/. Environment variables with the same names take precedence over the file.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${SWIFTDROP_POSTGRES_HOST:localhost}:${SWIFTDROP_POSTGRES_PORT:5432}/${SWIFTDROP_POSTGRES_DB:swiftdrop}
spring.datasource.username=${SWIFTDROP_POSTGRES_USER:swiftdrop}
spring.datasource.password=${SWIFTDROP_POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only validates it (see docs/ai-agent-guidelines.md, Project rules)
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ
spring.rabbitmq.host=${SWIFTDROP_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SWIFTDROP_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SWIFTDROP_RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${SWIFTDROP_RABBITMQ_PASSWORD}

# Reliability prerequisites for the outbox relay (ADR 0004). A relay must check both confirms
# and returns; these settings alone do not publish any business events.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Queue arguments are immutable after declaration; changes need a reviewed broker migration.
swiftdrop.messaging.delivery-limit=${SWIFTDROP_MESSAGING_DELIVERY_LIMIT:5}
swiftdrop.messaging.queue-max-length=${SWIFTDROP_MESSAGING_QUEUE_MAX_LENGTH:100000}

# Access tokens (identity module). The secret has no default; startup fails unless it has at least
# 32 bytes.
swiftdrop.security.jwt.secret=${SWIFTDROP_JWT_SECRET}
swiftdrop.security.jwt.issuer=${SWIFTDROP_JWT_ISSUER:swiftdrop}
swiftdrop.security.jwt.access-token-ttl=${SWIFTDROP_JWT_ACCESS_TOKEN_TTL:PT15M}

# Google sign-in (identity module). Optional: without a client ID, Google login is disabled and
# its endpoints do not exist. With a client ID, the secret is required.
swiftdrop.security.google.client-id=${SWIFTDROP_GOOGLE_CLIENT_ID:}
swiftdrop.security.google.client-secret=${SWIFTDROP_GOOGLE_CLIENT_SECRET:}

# Frontend base URL for OAuth callbacks and redirects (ADR 0005)
swiftdrop.frontend.base-url=${SWIFTDROP_FRONTEND_BASE_URL:http://localhost:3000}

# Browser origins allowed to call /api/** (comma-separated)
swiftdrop.cors.allowed-origins=${SWIFTDROP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap Dispatcher/Admin account (identity module). Optional: when both are set and no admin
# exists, an initial DISPATCHER_ADMIN is created on startup. If only one is set, startup fails.
swiftdrop.identity.bootstrap.admin-email=${SWIFTDROP_BOOTSTRAP_ADMIN_EMAIL:}
swiftdrop.identity.bootstrap.admin-password=${SWIFTDROP_BOOTSTRAP_ADMIN_PASSWORD:}

# Delivery module. Business time zone for "deliveries for the day" (D-09).
swiftdrop.delivery.business-time-zone=${SWIFTDROP_BUSINESS_TIME_ZONE:Asia/Colombo}
# Proof-of-delivery photos may be up to 2 MB (ADR 0006 §5); Spring's default limit is 1 MB.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Read uploads only when the controller asks for them, so an oversized photo reaches delivery's
# error handler (400) instead of the global catch-all (500).
spring.servlet.multipart.resolve-lazily=true

# Stage 3 workers are opt-in; configure the database and broker before enabling.
swiftdrop.messaging.processing-enabled=${SWIFTDROP_MESSAGING_PROCESSING_ENABLED:false}
swiftdrop.messaging.relay-poll-ms=${SWIFTDROP_MESSAGING_RELAY_POLL_MS:1000}
swiftdrop.messaging.relay-batch-size=${SWIFTDROP_MESSAGING_RELAY_BATCH_SIZE:100}
swiftdrop.messaging.confirm-timeout-seconds=${SWIFTDROP_MESSAGING_CONFIRM_TIMEOUT_SECONDS:5}
swiftdrop.messaging.reconciliation-poll-ms=${SWIFTDROP_MESSAGING_RECONCILIATION_POLL_MS:5000}
