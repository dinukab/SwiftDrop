# Test classpath copy of src/main/resources/application.properties. Spring Boot loads only ONE
# application.properties, and the test-classes copy shadows the main one, so every property the
# context needs must be repeated here. The only intentional differences are the two rate-limit
# overrides at the bottom (the suite makes hundreds of requests from 127.0.0.1).
spring.application.name=swiftdrop-backend

spring.config.import=optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${SWIFTDROP_POSTGRES_HOST:localhost}:${SWIFTDROP_POSTGRES_PORT:5432}/${SWIFTDROP_POSTGRES_DB:swiftdrop}
spring.datasource.username=${SWIFTDROP_POSTGRES_USER:swiftdrop}
spring.datasource.password=${SWIFTDROP_POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only validates it
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ
spring.rabbitmq.host=${SWIFTDROP_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SWIFTDROP_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SWIFTDROP_RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${SWIFTDROP_RABBITMQ_PASSWORD}

# Access tokens (identity module)
swiftdrop.security.jwt.secret=${SWIFTDROP_JWT_SECRET}
swiftdrop.security.jwt.issuer=${SWIFTDROP_JWT_ISSUER:swiftdrop}
swiftdrop.security.jwt.access-token-ttl=${SWIFTDROP_JWT_ACCESS_TOKEN_TTL:PT15M}

# Google sign-in (identity module)
swiftdrop.security.google.client-id=${SWIFTDROP_GOOGLE_CLIENT_ID:}
swiftdrop.security.google.client-secret=${SWIFTDROP_GOOGLE_CLIENT_SECRET:}

# Frontend base URL for OAuth callbacks and redirects (ADR 0005)
swiftdrop.frontend.base-url=${SWIFTDROP_FRONTEND_BASE_URL:http://localhost:3000}

# Browser origins allowed to call /api/** (comma-separated)
swiftdrop.cors.allowed-origins=${SWIFTDROP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap Dispatcher/Admin account (identity module)
swiftdrop.identity.bootstrap.admin-email=${SWIFTDROP_BOOTSTRAP_ADMIN_EMAIL:}
swiftdrop.identity.bootstrap.admin-password=${SWIFTDROP_BOOTSTRAP_ADMIN_PASSWORD:}

# Delivery module
swiftdrop.delivery.business-time-zone=${SWIFTDROP_BUSINESS_TIME_ZONE:Asia/Colombo}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true

# TEST OVERRIDES: effectively disable the per-IP rate limiter for the suite. Individual tests
# (SecurityHardeningApiTest) lower a limit via @SpringBootTest properties to verify 429s.
swiftdrop.rate-limit.auth-requests-per-minute=100000
swiftdrop.rate-limit.registration-requests-per-minute=100000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
swiftdrop.messaging.delivery-limit=5
swiftdrop.messaging.queue-max-length=100000
